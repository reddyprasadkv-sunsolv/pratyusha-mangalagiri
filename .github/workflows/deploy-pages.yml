name: Deploy Angular site to GitHub Pages

on:
  push:
    branches:
      - feature/angular-premium-sales-page
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static Angular site
        env:
          GITHUB_PAGES: 'true'
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build -- --output-mode static --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: Prepare Pages fallback
        run: |
          cp dist/pratyusha-mangalagiri/browser/index.html dist/pratyusha-mangalagiri/browser/404.html
          touch dist/pratyusha-mangalagiri/browser/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pratyusha-mangalagiri/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
