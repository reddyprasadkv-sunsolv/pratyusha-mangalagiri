<div class="form-field" [class.form-field--error]="error()">
  <label [for]="controlId()">
    {{ label() }}
    @if (optionalLabel()) {
      <span>{{ optionalLabel() }}</span>
    }
  </label>
  <ng-content />
  @if (error()) {
    <p class="form-field__error" [id]="controlId() + '-error'" role="alert">{{ error() }}</p>
  } @else if (hint()) {
    <p class="form-field__hint">{{ hint() }}</p>
  }
</div>
