<aside class="announcement" aria-label="Announcement">
  <p>{{ message() }}</p>
  <a [href]="actionHref()">
    {{ actionLabel() }}
    <span aria-hidden="true">→</span>
  </a>
  @if (dismissible()) {
    <button type="button" [attr.aria-label]="closeLabel()" (click)="dismiss.emit()">×</button>
  }
</aside>
