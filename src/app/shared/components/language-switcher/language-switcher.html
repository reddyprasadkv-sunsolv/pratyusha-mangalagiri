<div class="language-switcher" role="group" [attr.aria-label]="label()">
  <button
    type="button"
    [class.is-active]="locale() === 'en'"
    [attr.aria-pressed]="locale() === 'en'"
    [attr.aria-label]="englishLabel()"
    (click)="select('en')"
  >
    English
  </button>
  <span aria-hidden="true"></span>
  <button
    type="button"
    lang="te"
    [class.is-active]="locale() === 'te'"
    [attr.aria-pressed]="locale() === 'te'"
    [attr.aria-label]="teluguLabel()"
    (click)="select('te')"
  >
    తెలుగు
  </button>
</div>
