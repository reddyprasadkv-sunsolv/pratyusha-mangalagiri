<header class="section-heading" [class.section-heading--center]="align() === 'center'">
  <p class="section-heading__eyebrow">{{ eyebrow() }}</p>
  <h2>
    {{ title() }}
    @if (emphasis()) {
      <em>{{ emphasis() }}</em>
    }
  </h2>
  @if (description()) {
    <p class="section-heading__description">{{ description() }}</p>
  }
</header>
