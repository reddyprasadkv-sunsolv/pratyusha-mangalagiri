<header class="admin-page-header">
  <div>
    <h1>Products Catalog CRM</h1>
    <p>Add, edit, upload photos, update taglines, and delete products live on the website.</p>
  </div>
  <div class="lang-switch-pills">
    <button type="button" [class.active]="selectedLang() === 'en'" (click)="switchLang('en')">🇬🇧 English</button>
    <button type="button" [class.active]="selectedLang() === 'te'" (click)="switchLang('te')">🇮🇳 Telugu</button>
  </div>
</header>

@if (toastMessage(); as msg) {
  <div class="save-toast" role="status">{{ msg }}</div>
}

<div class="add-box">
  <h3>➕ Add New Product</h3>
  <div class="add-box__row">
    <input
      type="text"
      class="admin-input"
      placeholder="Product Name"
      [ngModel]="newProductName()"
      (ngModelChange)="newProductName.set($event)"
    />
    <input
      type="text"
      class="admin-input"
      placeholder="Supporting Line"
      [ngModel]="newProductSupporting()"
      (ngModelChange)="newProductSupporting.set($event)"
    />
    <input
      type="text"
      class="admin-input"
      placeholder="CTA Button Label"
      [ngModel]="newProductCta()"
      (ngModelChange)="newProductCta.set($event)"
    />
    <label class="admin-btn admin-btn--secondary file-btn">
      <span>📸 {{ newProductImageUrl() ? 'Photo Ready' : 'Choose Photo' }}</span>
      <input type="file" accept="image/*" (change)="onUploadNewProductPhoto($event)" class="hidden-file-input" />
    </label>
    <button type="button" class="admin-btn admin-btn--primary" (click)="addProduct()">Add Product</button>
  </div>
</div>

<div class="product-cards-grid">
  @for (prod of products(); track prod.id) {
    <div class="product-item-card">
      <div class="product-item-card__header">
        <span class="prod-id">{{ prod.id }}</span>
        <button type="button" class="del-btn" (click)="deleteProduct(prod.id)">🗑️ Delete</button>
      </div>

      <div class="prod-img-preview">
        <img [src]="prod.imageUrl" [alt]="prod.nameEn" loading="lazy" />
        <label class="change-photo-overlay" title="Click to replace product photo">
          <span>📸 Change Photo</span>
          <input type="file" accept="image/*" (change)="onUploadProductPhoto(prod, $event)" class="hidden-file-input" />
        </label>
      </div>

      <div class="form-group">
        <label>Product Title</label>
        <input
          #prodTitleInput
          type="text"
          class="admin-input"
          [value]="selectedLang() === 'en' ? prod.nameEn : prod.nameTe"
          (change)="updateProduct(prod, selectedLang() === 'en' ? 'nameEn' : 'nameTe', prodTitleInput.value)"
        />
      </div>
      <div class="form-group">
        <label>Supporting Line</label>
        <input
          #prodSuppInput
          type="text"
          class="admin-input"
          [value]="prod.supporting"
          (change)="updateProduct(prod, 'supporting', prodSuppInput.value)"
        />
      </div>
      <div class="form-group">
        <label>CTA Button Text</label>
        <input
          #prodCtaInput
          type="text"
          class="admin-input"
          [value]="prod.cta"
          (change)="updateProduct(prod, 'cta', prodCtaInput.value)"
        />
      </div>
      <div style="margin-top: 0.75rem; text-align: right;">
        <button type="button" class="admin-btn admin-btn--primary" (click)="updateProduct(prod, selectedLang() === 'en' ? 'nameEn' : 'nameTe', prodTitleInput.value); updateProduct(prod, 'supporting', prodSuppInput.value); updateProduct(prod, 'cta', prodCtaInput.value)">
          💾 Save Product
        </button>
      </div>
    </div>
  }
</div>
