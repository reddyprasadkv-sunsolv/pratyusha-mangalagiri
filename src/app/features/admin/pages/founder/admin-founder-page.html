<header class="admin-page-header">
  <div>
    <h1>Founder Profile Manager</h1>
    <p>Edit Pratyusha Mangalagiri's bio, credentials, badges, and background story ({{ selectedLang() === 'en' ? 'English' : 'Telugu' }} view).</p>
  </div>
  <div class="header-actions" style="display: flex; gap: 0.75rem; align-items: center;">
    <button type="button" class="admin-btn admin-btn-secondary" (click)="autoTranslateDesignation()" title="Convert English designation (Founder) automatically to Telugu">
      ✨ Auto-Translate Designation to Telugu
    </button>
    <button type="button" class="reset-btn" (click)="resetDefaults()" title="Reset to original default copy for this language">
      🔄 Reset Defaults
    </button>
    <div class="lang-switch-pills">
      <button type="button" [class.active]="selectedLang() === 'en'" (click)="switchLang('en')">🇬🇧 English</button>
      <button type="button" [class.active]="selectedLang() === 'te'" (click)="switchLang('te')">🇮🇳 Telugu</button>
    </div>
  </div>
</header>

@if (toastMessage(); as msg) {
  <div class="save-toast" role="status">{{ msg }}</div>
}

<div class="editor-grid">
  <div class="form-card">
    <h3>Bio & Identity ({{ selectedLang() === 'en' ? 'English' : 'Telugu' }})</h3>
    <div class="form-group">
      <label>Founder Section Title</label>
      <input
        type="text"
        class="admin-input"
        [ngModel]="aboutTitle()"
        (ngModelChange)="aboutTitle.set($event)"
      />
    </div>
    <div class="form-group">
      <label>Eyebrow Subtitle</label>
      <input
        type="text"
        class="admin-input"
        [ngModel]="aboutEyebrow()"
        (ngModelChange)="aboutEyebrow.set($event)"
      />
    </div>
    <div class="form-group">
      <label>Badge / Designation Label</label>
      <input
        type="text"
        class="admin-input"
        [ngModel]="aboutBadge()"
        (ngModelChange)="aboutBadge.set($event)"
        placeholder="e.g. Founder / PERSONAL GUIDANCE"
      />
    </div>
  </div>

  <div class="form-card">
    <h3>Story & Credentials</h3>
    <div class="form-group">
      <label>Full Bio / Background Story</label>
      <textarea
        class="admin-input admin-textarea"
        rows="5"
        [ngModel]="aboutBody()"
        (ngModelChange)="aboutBody.set($event)"
      ></textarea>
    </div>
    <div class="form-group">
      <label>Portrait Image Alt Text</label>
      <input
        type="text"
        class="admin-input"
        [ngModel]="founderAlt()"
        (ngModelChange)="founderAlt.set($event)"
      />
    </div>
  </div>
</div>

<div class="admin-actions-bar" style="margin-top: 1.5rem; display: flex; justify-content: flex-end;">
  <button type="button" class="admin-btn admin-btn-primary" (click)="saveFounderProfile()">
    💾 Save Changes
  </button>
</div>
