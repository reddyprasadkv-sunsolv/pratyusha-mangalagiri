<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#3d182b" />
      <stop offset="100%" stop-color="#1a0913" />
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0d5" />
      <stop offset="25%" stop-color="#f5e0b3" />
      <stop offset="60%" stop-color="#d7bd8a" />
      <stop offset="90%" stop-color="#b89456" />
      <stop offset="100%" stop-color="#8f6b32" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0b3" />
      <stop offset="50%" stop-color="#d7bd8a" />
      <stop offset="100%" stop-color="#8f6b32" />
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)" />

  <!-- Outer Elegant Gold Frame -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#border-grad)" stroke-width="14" />
  <circle cx="256" cy="256" r="204" fill="none" stroke="url(#border-grad)" stroke-width="3" stroke-dasharray="8 8" opacity="0.6" />

  <!-- PM Monogram -->
  <text
    x="256"
    y="316"
    font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif"
    font-size="200"
    font-weight="700"
    fill="url(#gold-grad)"
    text-anchor="middle"
    letter-spacing="6"
    filter="url(#gold-glow)"
  >PM</text>

  <!-- Top Sparkle Accent -->
  <path d="M256,68 L261,90 L283,95 L261,100 L256,122 L251,100 L229,95 L251,90 Z" fill="url(#gold-grad)" />
</svg>
